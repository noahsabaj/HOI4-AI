name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Windows matches the only platform this project runs on, and several modules
    # import Windows-only paths at call time rather than at import time.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # GitHub's Windows runners are a mixed pool, and on some of them torch dies with an
      # illegal instruction (0xc000001d) part-way through the suite, on an unchanged
      # lockfile. ATEN_CPU_CAPABILITY alone did not stop it: it caps ATen's own dispatch,
      # but the torch wheel also bundles MKL, which dispatches separately and is capped by
      # MKL_ENABLE_INSTRUCTIONS. Both are set until a green run proves which one mattered.
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # --frozen resolves from uv.lock, which pins torch to the CUDA 12.8 index. The
      # tests themselves run on CPU; torch.cuda.is_available() is simply false here.
      - run: uv sync --python 3.12 --extra dev --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      # The crash is a hard fault, so pytest prints no summary and -q leaves only a row of
      # dots: the run that prompted this showed 25 of them and no test name. -v names the
      # test that was executing, which is the one thing needed to tell a torch dispatch
      # problem from a bug of ours. (With -n, a crashed worker is named with its test.)
      # One test at a time took 9 of the job's 10 minutes; a dozen tests are 5 of those,
      # so the workers steal work rather than split the files evenly.
      - run: uv run pytest -v -n auto --dist worksteal
      # Runs whatever the outcome, so a crashed run still says which machine it was on.
      - if: always()
        run: uv run python -c "import platform, torch; print(platform.processor()); print(torch.__config__.show())"

  rust:
    # Must be Windows: the entire worker lives in `#[cfg(windows)] mod platform`, so
    # Clippy on Linux would compile none of it and report success on an empty crate.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  web:
    # The live view's page (web/live, SvelteKit), built into the Python package that serves
    # it: the build committed there must be the one the source makes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/live/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: The committed build is current
        run: |
          git status --porcelain -- ../../src/hoi4_arena/live/page
          test -z "$(git status --porcelain -- ../../src/hoi4_arena/live/page)"
