name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Windows matches the only platform this project runs on, and several modules
    # import Windows-only paths at call time rather than at import time.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # GitHub's Windows runners are a mixed pool, and on some of them torch dispatched a
      # kernel the CPU does not implement: pytest died with an illegal instruction
      # (0xc000001d) inside GRUCell, twice in four runs, on an unchanged lockfile. Capping
      # the dispatch below AVX-512 keeps the same results on every machine in the pool.
      ATEN_CPU_CAPABILITY: avx2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # --frozen resolves from uv.lock, which pins torch to the CUDA 12.8 index. The
      # tests themselves run on CPU; torch.cuda.is_available() is simply false here.
      - run: uv sync --python 3.12 --extra dev --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q

  rust:
    # Must be Windows: the entire worker lives in `#[cfg(windows)] mod platform`, so
    # Clippy on Linux would compile none of it and report success on an empty crate.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
