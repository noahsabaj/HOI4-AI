[project]
name = "hoi4-agent"
version = "0.1.0"
description = "HOI4 vision agent and experimental local combat-learning arena"
requires-python = ">=3.11"
# Minimal deps by design: stdlib + these. No opencv / pydantic / pyyaml / pywin32 / onnxruntime.
dependencies = [
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.10"]
arena = ["torch>=2.6,<3", "pefile==2024.8.26"]
native = ["nlohmann-json==3.12.0"]
# Optional OCR middle tier for numeric reads (glyphs -> OCR -> VLM).
# (rapidocr v2+ is the maintained package with py3.13+ support; the legacy
# rapidocr-onnxruntime import path is also handled if already installed.)
ocr = ["rapidocr>=2.0", "onnxruntime>=1.17"]

[project.scripts]
hoi4-arena = "hoi4_agent.arena.cli:main"

[tool.setuptools.packages.find]
# Flat layout with a sibling config/ dir: name the package explicitly so
# setuptools auto-discovery doesn't refuse the build.
include = ["hoi4_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
cache_dir = ".cache/pytest"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [".tooling", ".cache", "artifacts"]

[tool.ruff.lint]
# Explicitly retain the checks used by the original project across Ruff versions.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ctypes structure/DLL plumbing trips strict attribute checks; the module is
# exercised by the Windows-only smoke path instead.
module = "hoi4_agent.io.windows"
ignore_errors = true
