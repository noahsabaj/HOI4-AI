# PLACEHOLDER arena vision calibration: NOTHING below has been measured in the live arena.
# Run `calibrate-arena --layout <layout.json>` with the game open to replace it.
#   [roi]      copied from hoi4_agent.calibration.default_calibration (arbitrary, not real HOI4 positions)
#   [points]   empty on purpose: reset, deselect, army_select, pause_button and speed_1..5 refuse
#              to act until hovered, rather than click a guess
#   [panel]    enabled = false until the army-panel rows are hovered
#   [counters] frame colours are measured on the real samples under tests/data/arena
#              (own and its geometry on sample_map_600x400.png; enemy and other on
#              sample_front_1680x1050.png). "other" is the blue frame of allied/other-relation units.
#   [hotkeys]  read from the installed game's interface/localisation files, not yet exercised live
#   [log]      path of the game.log carrying the mod's ARENA_RESET / ARENA_OUTCOME lines
[resolution]
width = 2560
height = 1440

[window]
title = "Hearts of Iron"

[map]
rect = [0.0, 0.05, 1.0, 1.0]
max_assign_distance = 0.04
color_tolerance = 40.0

[roi]
date = [0.46, 0.012, 0.52, 0.034]
speed = [0.415, 0.01, 0.46, 0.032]
pause = [0.4, 0.01, 0.415, 0.032]

[points]

[panel]
enabled = false
first_row = [0.005, 0.3, 0.17, 0.325]
row_pitch = 0.027
max_rows = 24
org_bar = [0.55, 0.15, 0.95, 0.4]
strength_bar = [0.55, 0.6, 0.95, 0.85]
selected_probe = [0.0, 0.0, 0.04, 1.0]
row_present_std = 12.0
lit_value = 90.0
selected_value = 150.0

[flag_colors]

[map_colors]

[counters]
scale = 1.0
own_frame_rgb = [63, 139, 76]
enemy_frame_rgb = [178, 59, 59]
other_frame_rgb = [61, 127, 184]

[paths]
templates = "templates"
counter_digits = "templates/arena"

[perception]
match_threshold = 0.75

[hotkeys]
support_attack_modifier = "ctrl"
halt = "h"
pause = "space"
speed_up = "+"
speed_down = "-"
speed_direct = ["1", "2", "3", "4", "5"]

[executor]
budget_ms = 1500
settle_ms = 120
confirm_polls = 3
speed_mode = "auto"
pause_mode = "key"
reset_sequence = ["decisions_open", "reset_decision", "decisions_close"]
reset_timeout_s = 20.0
arrow_min_fraction = 0.25

[log]
path = ""
