# HOI4-AI v4 runtime configuration.
# mode: "robust" (deterministic verification). "purist" (VLM verifies too) is a
# designed seam that is NOT implemented — the loader rejects it.
mode = "robust"

[llm]
# Active model profile. Interim default is the free Ollama cloud model; after
# the live M0 shootout (`eval --all-profiles`), switch to the best LOCAL
# profile that clears >=90% on read tasks and retire the cloud default.
profile = "gemma4-cloud"

[llm.profiles.gemma4-cloud]         # interim: Ollama free cloud (31B, thinking)
backend = "ollama"                  # "ollama" (native vision) | "openai_compat" (LM Studio / llama.cpp)
endpoint = "http://localhost:11434"
model = "gemma4:31b-cloud"
timeout_s = 120.0

[llm.profiles.gemma4-local]         # generalist, ~6 GB VRAM
backend = "ollama"
endpoint = "http://localhost:11434"
model = "gemma4:e4b-it-qat"
timeout_s = 120.0

[llm.profiles.qwen3vl-4b]           # best small ScreenSpot-Pro score in Ollama library
backend = "ollama"
endpoint = "http://localhost:11434"
model = "qwen3-vl:4b"
timeout_s = 120.0

[llm.profiles.holo31-9b]            # GUI-agent specialist (GGUF via LM Studio / llama.cpp server)
backend = "openai_compat"
endpoint = "http://localhost:1234"
model = "holo-3.1-9b"
timeout_s = 120.0

[llm.profiles.holo31-4b]            # smaller Holo, ~3 GB at Q4
backend = "openai_compat"
endpoint = "http://localhost:1234"
model = "holo-3.1-4b"
timeout_s = 120.0

[display]
width = 2560                        # locked client resolution (assert at startup)
height = 1440

[timing]
action_dwell_ms = 40               # pause between mouse move and click
settle_ms = 150                    # wait after any injected input before re-perceiving
verify_read_retries = 2            # extra re-READS (never re-clicks) when a verify metric is unreadable
max_retries = 2                    # bounded retries per tool before recover/halt
ncc_threshold = 0.75               # template-match confidence floor; below => UNCERTAIN
run_speed = 4                      # HOI4 speed to advance time at
cycle_days = 7                     # base in-game days to advance between decision checks
max_advance_days = 56              # cap for the quiet-world advance backoff (7 -> 14 -> 28 -> 56)

[recovery]
vlm_consult = true                 # one bounded VLM hint when deterministic recovery fails, before halting

[capture]
# "mss" (desktop region) | "printwindow" (window renders itself into our bitmap:
# immune to overlays/notifications/occlusion). Validate printwindow via the live
# smoke's capture_printwindow step (black frame = unsupported) before switching.
backend = "mss"

[grounding]
# Locator model for click-points missing from calibration (crop-then-ground
# fallback; verified by the same postconditions as calibrated clicks). Name an
# [llm.profiles.*] entry, e.g. "holo31-9b" — but only after locate tasks clear
# M0. Empty = disabled.
profile = ""

[paths]
calibration = "config/calibration.toml"
templates = "templates"
playbook = "config/playbooks/germany_1936.toml"
trace_dir = "runs"
corpus = "eval/corpus"
