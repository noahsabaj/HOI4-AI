# Germany 1936 — Milestone-1 playbook (construction + research).
#
# Ordered goals. Each build/research goal is SELF-CONTAINED: the tool opens the
# needed panel (and selects the building) on its own, so there is no fragile
# ordered-setup coupling. One-shot goals gate strictly (a goal blocks the next
# until its precondition is visible); REPEATABLE goals never block — when not
# ready they are stepped past, and they are re-offered every cycle.
#
# Strategy (solved early-game meta): never leave a research slot idle — the
# three one-shot goals fill the 1936 slots in priority order, then the
# repeatable "refill" goal re-fires whenever a completed tech frees a slot,
# with the model choosing the best available tech (re-assigning a FIXED tech
# would click an already-researching entry and verify-fail, so refill is a
# judgment call by design). Build civilian factories into high-slot states
# first. Civ->mil switchover and more states/techs are future additions
# (enum member + calibrated point, no code change).

# Approximate research durations (in-game days) — WAKE-UP HINTS for the time
# advance only; the agent still verifies slot state by perception. Rough 1936
# no-bonus values; precision is unimportant.
[research_days]
construction_1 = 170
construction_2 = 190
construction_3 = 210
industry_1 = 170
industry_2 = 190
electronics_1 = 170
radar_1 = 190
land_doctrine_1 = 140

# --- research: fill the three 1936 slots in priority order ---
[[goal]]
id = "research_construction_1"
tool = "assign_research"
tech = "construction_1"
precondition = "idle_research_slot"

[[goal]]
id = "research_industry_1"
tool = "assign_research"
tech = "industry_1"
precondition = "idle_research_slot"

[[goal]]
id = "research_electronics_1"
tool = "assign_research"
tech = "electronics_1"
precondition = "idle_research_slot"

# --- research: refill any slot that frees up (never blocks later goals) ---
[[goal]]
id = "research_refill"
tool = "assign_research"
precondition = "idle_research_slot"
repeatable = true
needs_judgment = true

# --- construction: civilian factories into high-slot states ---
[[goal]]
id = "build_ruhr"
tool = "build_in_state"
building = "civilian_factory"
state = "ruhr"
precondition = "free_civ_slot"

[[goal]]
id = "build_saxony"
tool = "build_in_state"
building = "civilian_factory"
state = "saxony"
precondition = "free_civ_slot"

[[goal]]
id = "build_rhineland"
tool = "build_in_state"
building = "civilian_factory"
state = "rhineland"
precondition = "free_civ_slot"

[[goal]]
id = "build_westphalia"
tool = "build_in_state"
building = "civilian_factory"
state = "westphalia"
precondition = "free_civ_slot"

# --- hold the run open long enough for the repeatable goal to matter ---
# The loop finishes when every ONE-SHOT is done (repeatables never gate
# completion, by design). Without this goal that happened ~50 in-game days in,
# as soon as the four builds landed — while the fastest tech in [research_days]
# above takes 140 days. So no research slot could ever free before the run
# ended, and "research_refill" — the ONLY goal in this playbook that asks the
# model to decide anything — could never fire against a real freed slot. The
# agent would finish having made zero judgments.
#
# This goal blocks on a date instead of a game fact, so the loop keeps advancing
# time, techs complete, and refill re-fires as slots open. Move the date to
# change how long a run lasts.
[[goal]]
id = "hold_until_1937"
tool = "observe"
precondition = "date_after"
precondition_date = "1937.1.1"

# --- leave the UI at a clean home state ---
[[goal]]
id = "close_panels"
tool = "close_panels"
