# Germany 1936 — Milestone-1 playbook (construction + research).
#
# Ordered goals. Each build/research goal is SELF-CONTAINED: the tool opens the
# needed panel (and selects the building) on its own, so there is no fragile
# ordered-setup coupling. One-shot goals gate strictly (a goal blocks the next
# until its precondition is visible); REPEATABLE goals never block — when not
# ready they are stepped past, and they are re-offered every cycle.
#
# Strategy (solved early-game meta): never leave a research slot idle — the
# three one-shot goals fill the 1936 slots in priority order, then the
# repeatable "refill" goal re-fires whenever a completed tech frees a slot,
# with the model choosing the best available tech (re-assigning a FIXED tech
# would click an already-researching entry and verify-fail, so refill is a
# judgment call by design). Build civilian factories into high-slot states
# first. Civ->mil switchover and more states/techs are future additions
# (enum member + calibrated point, no code change).

# --- research: fill the three 1936 slots in priority order ---
[[goal]]
id = "research_construction_1"
tool = "assign_research"
tech = "construction_1"
precondition = "idle_research_slot"

[[goal]]
id = "research_industry_1"
tool = "assign_research"
tech = "industry_1"
precondition = "idle_research_slot"

[[goal]]
id = "research_electronics_1"
tool = "assign_research"
tech = "electronics_1"
precondition = "idle_research_slot"

# --- research: refill any slot that frees up (never blocks later goals) ---
[[goal]]
id = "research_refill"
tool = "assign_research"
precondition = "idle_research_slot"
repeatable = true
needs_judgment = true

# --- construction: civilian factories into high-slot states ---
[[goal]]
id = "build_ruhr"
tool = "build_in_state"
building = "civilian_factory"
state = "ruhr"
precondition = "free_civ_slot"

[[goal]]
id = "build_saxony"
tool = "build_in_state"
building = "civilian_factory"
state = "saxony"
precondition = "free_civ_slot"

[[goal]]
id = "build_rhineland"
tool = "build_in_state"
building = "civilian_factory"
state = "rhineland"
precondition = "free_civ_slot"

[[goal]]
id = "build_westphalia"
tool = "build_in_state"
building = "civilian_factory"
state = "westphalia"
precondition = "free_civ_slot"

# --- leave the UI at a clean home state ---
[[goal]]
id = "close_panels"
tool = "close_panels"
